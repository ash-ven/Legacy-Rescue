name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      # i binari di MongoDB scaricati dal database in memoria restano in cache tra un'esecuzione e l'altra
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:coverage

  lint:
    runs-on: ubuntu-latest
    env:
      # il lint non usa MongoDB: niente download dei binari durante npm ci
      MONGOMS_DISABLE_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # versione fissata: .gitleaks.toml usa la sintassi [[allowlists]], verificata con questa versione
          GITLEAKS_VERSION: "8.30.1"
